<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff8e8">
<title>Игра с Цыпой — учимся играя</title>
<style>
:root{--bg:#fff8e8;--ink:#3c342b;--yellow:#ffd84d;--green:#72c78a;--red:#ef6b68;--blue:#68aee8;--card:#fff;--shadow:0 8px 25px rgba(74,55,30,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#fffaf0,#fff3d7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh}
button{font:inherit;border:0}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px}
.logo{font-size:24px;font-weight:800}.score{font-size:16px;background:#fff;border-radius:20px;padding:8px 13px;box-shadow:var(--shadow)}
.progress{height:9px;background:#eadfca;border-radius:20px;overflow:hidden;margin:5px 0 16px}.bar{height:100%;width:0;background:var(--yellow);transition:.35s}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px 16px 20px;text-align:center}
.question{font-size:25px;font-weight:800;margin:3px 0 8px}.hint{font-size:16px;color:#776b5c;margin:0 0 12px}
.picture{height:220px;border-radius:22px;background:#f8f1df;display:flex;align-items:center;justify-content:center;margin:8px 0 16px;overflow:hidden}
.picture svg{width:82%;height:82%;max-width:330px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{min-height:78px;background:#fff;border:3px solid #eee2cc;border-radius:20px;font-size:21px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 #e7dac2;transition:.12s;touch-action:manipulation}
.answer:active{transform:scale(.97)}
.answer.correct{border-color:var(--green);background:#e9f9ed}
.answer.wrong{border-color:var(--red);background:#fff0ef}
.feedback{min-height:45px;padding:10px 5px 0;font-size:19px;font-weight:800}
.next{display:none;width:100%;margin-top:8px;padding:15px;border-radius:18px;background:var(--blue);color:white;font-weight:800;font-size:20px}
.sound{margin-top:13px;padding:11px 16px;border-radius:18px;background:#fff;border:2px solid #eadfca;font-weight:700}
.start,.finish{padding:28px 16px}.start h1,.finish h1{font-size:32px;margin:4px 0 8px}.start p,.finish p{font-size:18px;line-height:1.45;color:#6f6253}
.play{background:var(--yellow);padding:16px 28px;border-radius:22px;font-size:22px;font-weight:900;box-shadow:0 4px 0 #e6bd28;margin-top:8px}
.mini{font-size:14px;color:#8b7d69;margin-top:16px}
@media(min-width:600px){.picture{height:270px}.question{font-size:29px}.answer{min-height:88px}}
</style>

menuMusic.setAttribute('playsinline','');
let musicReady=true;
let musicOn=false;
async function toggleMusic(){
  if(!musicReady){ alert('Не удалось загрузить песенку. Попробуй открыть файл в Safari.'); return; }
  if(!musicOn){
    try{
      menuMusic.currentTime=0;
      await menuMusic.play();
      musicOn=true;
    }catch(e){
      musicOn=false;
      document.getElementById('musicBtn').textContent='🎵 Нажми ещё раз';
    }
  }else{
    menuMusic.pause(); musicOn=false;
  }
  const btn=document.getElementById('musicBtn');
  if(btn) btn.textContent=musicOn?'🔇 Выключить песню':'🎵 Включить песню';
}
function stopMusic(){menuMusic.pause(); menuMusic.currentTime=0; musicOn=false;}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ru-RU'; u.rate=.78; u.pitch=1.28; u.volume=1;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(v=>/ru/i.test(v.lang) && /child|kid|girl|female|жен|дет/i.test(v.name));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

function renderQ(){
 locked=false; const x=questions[n]; bar.style.width=((n)/questions.length*100)+"%";
 main.innerHTML=`<section class="card"><div class="question">${x.q}</div><div class="hint">${x.h}</div><div class="picture">${svg[x.img]}</div><div class="answers">${x.a.map((v,i)=>`<button class="answer" onclick="answer(${i})">${v}</button>`).join("")}</div><div class="feedback" id="fb"></div><button class="next" id="next" onclick="next()">Дальше ➜</button><button class="sound" onclick="speak(${JSON.stringify(x.q+" "+x.h)})">🔊 Повторить вопрос</button></section>`;
  setTimeout(()=>speak(x.q+" "+x.h),250);
}
function answer(i){
 if(locked)return; locked=true; const x=questions[n], btns=[...document.querySelectorAll(".answer")];
 btns[i].classList.add(i===x.ok?"correct":"wrong");
 if(i===x.ok){score++;scoreEl.textContent="⭐ "+score; document.getElementById("fb").textContent="🎉 Правильно! Молодец!"; speak("Правильно! Молодец!");}
 else{btns[x.ok].classList.add("correct"); document.getElementById("fb").textContent="🌟 Попробуй ещё! Правильный ответ — "+x.a[x.ok]; speak("Попробуй ещё! Правильный ответ — "+x.a[x.ok]);}
 document.getElementById("next").style.display="block";
}
function next(){n++; if(n>=questions.length){finish();return} renderQ();}
function finish(){
 bar.style.width="100%";
 const msg=score>=8?"Ты настоящий умница!":"Отлично! Давай попробуем ещё раз!";
 main.innerHTML=`<section class="card finish"><div style="font-size:80px">🐥🌟</div><h1>${msg}</h1><p>Твой результат: <b>${score} из ${questions.length}</b></p><button class="play" onclick="start()">🔄 Играть ещё</button><br><button class="sound" onclick="speak('Ура! Ты набрал '+score+' правильных ответов из '+questions.length+'. Молодец!')">🔊 Послушать результат</button></section>`;
 speak("Ура! Ты набрал "+score+" правильных ответов из "+questions.length+". Молодец!");
}
renderStart();
</script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body>
